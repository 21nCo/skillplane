  "@fontsource-variable/dm-sans": 5.3.0
  "@sveltejs/adapter-cloudflare": 7.2.9
  "@sveltejs/kit": 2.70.1
  "@sveltejs/vite-plugin-svelte": 7.2.0
  "@tailwindcss/vite": 4.3.3
