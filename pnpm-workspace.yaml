packages:
  - app
  - docs
  - mcp
  - packages/*

allowBuilds:
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

overrides:
  # sendfn's APNs transport is not used by Skillplane, but it remains in the
  # production dependency graph. Pin its JWT implementation above all known
  # algorithm/cache/empty-secret advisories.
  fast-jwt: 6.2.4

catalog:
  "@21n/fonts": 1.0.1
  "@opennextjs/cloudflare": 1.20.2
  "@phosphor-icons/react": 2.1.10
  "@tailwindcss/postcss": 4.3.3
