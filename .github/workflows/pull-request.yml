name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build reviewed native dependencies
        run: pnpm rebuild esbuild

      - name: Generate framework types
        run: |
          pnpm --filter @skillplane/app sync
          pnpm --filter @skillplane/docs exec fumadocs-mdx

      - name: Check AuthFn schema lock
        run: pnpm authfn-schema:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify McpFn adoption
        run: pnpm mcpfn:verify

      - name: Verify mdfn adoption
        run: pnpm mdfn:verify

      - name: Verify workspace boundaries
        run: pnpm boundaries:verify

      - name: Lint design system
        run: pnpm lint:design-system

      - name: Unit tests
        run: pnpm test:unit
