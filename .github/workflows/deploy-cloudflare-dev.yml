name: Deploy Cloudflare development topology

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('dev-build-{0}', github.event.pull_request.number) || 'deploy-cloudflare-dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build reviewed native dependencies
        run: pnpm rebuild esbuild protobufjs sharp workerd

      - name: Build and dry-run Cloudflare configs
        run: pnpm deploy:check

  deploy:
    # Only the dev branch may deploy, whether pushed or dispatched manually.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    env:
      # Development deploys target the 21n-dev Cloudflare account only.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEV_ACCOUNT_ID }}
      # Deploy scripts refuse to run when the account above equals this one.
      SKILLPLANE_PRODUCTION_CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PROD_ACCOUNT_ID }}
      CLOUDFLARE_DEV_CONTROL_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_DEV_CONTROL_HYPERDRIVE_ID }}
      CLOUDFLARE_DEV_CELL_IN_SOUTH_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_DEV_CELL_IN_SOUTH_HYPERDRIVE_ID }}
      CLOUDFLARE_DEV_CELL_US_EAST_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_DEV_CELL_US_EAST_HYPERDRIVE_ID }}
      CLOUDFLARE_DEV_CELL_EU_WEST_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_DEV_CELL_EU_WEST_HYPERDRIVE_ID }}
      PUBLIC_DEV_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_DEV_TURNSTILE_SITE_KEY }}
      DATAFN_DIRECT_ENABLED: ${{ vars.DATAFN_DIRECT_ENABLED }}
      DATAFN_DIRECT_WORKSPACES: ${{ vars.DATAFN_DIRECT_WORKSPACES }}
      DATAFN_ROUTE_ACTIVE_KEY_ID: ${{ vars.DATAFN_ROUTE_ACTIVE_KEY_ID }}
      DATAFN_ROUTE_PUBLIC_KEYS: ${{ vars.DATAFN_ROUTE_PUBLIC_KEYS }}
    steps:
      - name: Verify development ref and account
        shell: bash
        env:
          CLOUDFLARE_PROD_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PROD_ACCOUNT_ID }}
          # Account used by deploy-cloudflare-tag.yml for production releases.
          CLOUDFLARE_RELEASE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_DEV_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN != '' }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/dev" ]]; then
            echo "Development deploys only run from refs/heads/dev (got ${GITHUB_REF})" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_DEV_ACCOUNT_ID is not configured" >&2
            exit 1
          fi
          if [[ "${HAS_DEV_API_TOKEN}" != "true" ]]; then
            echo "CLOUDFLARE_DEV_API_TOKEN is not configured" >&2
            exit 1
          fi
          # Fail closed: the guard is meaningless without a production account to compare against.
          if [[ -z "${CLOUDFLARE_PROD_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_PROD_ACCOUNT_ID must be configured for the production-account guard" >&2
            exit 1
          fi
          # Account IDs are hex; compare case-insensitively.
          dev_account_id="${CLOUDFLARE_ACCOUNT_ID,,}"
          prod_account_id="${CLOUDFLARE_PROD_ACCOUNT_ID,,}"
          release_account_id="${CLOUDFLARE_RELEASE_ACCOUNT_ID,,}"
          if [[ "${dev_account_id}" == "${prod_account_id}" ]]; then
            echo "Development deploys must not target the production account" >&2
            exit 1
          fi
          if [[ -n "${release_account_id}" && "${dev_account_id}" == "${release_account_id}" ]]; then
            echo "Development deploys must not target the production release account (vars.CLOUDFLARE_ACCOUNT_ID)" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build reviewed native dependencies
        run: pnpm rebuild esbuild protobufjs sharp workerd

      - name: Validate Cloudflare configs
        run: pnpm deploy:check

      - name: Deploy development topology
        run: pnpm deploy:dev:topology
        env:
          SKILLPLANE_DEV_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEV_API_TOKEN }}
          SKILLPLANE_DEV_CONTROL_DATABASE_URL: ${{ secrets.SKILLPLANE_DEV_CONTROL_DATABASE_URL }}
          SKILLPLANE_DEV_DATABASE_URL: ${{ secrets.SKILLPLANE_DEV_DATABASE_URL }}
          SKILLPLANE_DEV_USEAST_DATABASE_URL: ${{ secrets.SKILLPLANE_DEV_USEAST_DATABASE_URL }}
          SKILLPLANE_DEV_EUWEST_DATABASE_URL: ${{ secrets.SKILLPLANE_DEV_EUWEST_DATABASE_URL }}
          SKILLPLANE_DEV_AUTHFN_SECRET: ${{ secrets.SKILLPLANE_DEV_AUTHFN_SECRET }}
          SKILLPLANE_DEV_OAUTH_TOKEN_PEPPER: ${{ secrets.SKILLPLANE_DEV_OAUTH_TOKEN_PEPPER }}
          SKILLPLANE_DEV_TURNSTILE_SECRET_KEY: ${{ secrets.SKILLPLANE_DEV_TURNSTILE_SECRET_KEY }}
          SKILLPLANE_DEV_WORKSPACE_ROUTING_SECRET: ${{ secrets.SKILLPLANE_DEV_WORKSPACE_ROUTING_SECRET }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          DATAFN_ROUTE_PRIVATE_KEY_PEM: ${{ secrets.DATAFN_ROUTE_PRIVATE_KEY_PEM }}
          AUTHFN_PLACEMENT_SUBJECT_SECRET: ${{ secrets.AUTHFN_PLACEMENT_SUBJECT_SECRET }}
